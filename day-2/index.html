<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal JS Loops</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>JS Loops Demo</h1>
    
    <!-- User Input -->
    <div class="input-group">
      <label for="userInput">Enter a number or comma-separated values:</label>
      <input type="text" id="userInput" value="a, b, c, d">
    </div>

    <!-- Loop Action Buttons -->
    <div class="button-grid">
      <button onclick="runFor()">For Loop</button>
      <button onclick="runWhile()">While Loop</button>
      <button onclick="runDoWhile()">Do-While Loop</button>
      <button onclick="runForIn()">For...In Loop</button>
      <button onclick="runForOf()">For...Of Loop</button>
      <button onclick="runForEach()">forEach Loop</button>
    </div>

    <!-- UI Output Box -->
    <h2>Output:</h2>
    <div id="output" class="output-box">Click a button above to run a loop...</div>
  </div>

  <script src="index.js"></script>
</body>
</html>
