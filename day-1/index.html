<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <div>
    <form id="normalForm">
      <label for="nameInput">
        <input type="text" placeholder="Enter your name" class="nameInput" id="nameInput">
      </label>
      <label for="passwordInput">
        <input type="password" placeholder="Enter your password" class="passwordInput" id="passwordInput">
      </label>
      <button type="submit" id="submitBtn">Submit</button>
    </form>
  </div>

  <div>
    <label for="input" id="input"></label>
    <label for="nameInputValidation" id="nameInputValidation"></label>
  </div>
</body>

</html>
